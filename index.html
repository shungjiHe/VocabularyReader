<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文朗讀工具</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 28px 18px 48px;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background-color: #f4f6f8;
            color: #222;
        }

        .app-container {
            width: min(1100px, 100%);
            margin: 0 auto;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 18px;
        }

        .app-header h1 {
            margin: 0;
            font-size: 28px;
        }

        .mode-control {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .card {
            margin-bottom: 16px;
            padding: 20px;
            border: 1px solid #d9dee5;
            border-radius: 10px;
            background-color: #fff;
        }

        .card-title {
            margin: 0 0 14px;
            font-size: 18px;
            font-weight: bold;
            text-align: left;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 12px 14px;
            border: 1px solid #bfc7d1;
            border-radius: 6px;
            font-size: 17px;
            line-height: 1.45;
            resize: vertical;
        }

        textarea.blind-mode {
            color: transparent;
            caret-color: transparent;
            -webkit-text-fill-color: transparent;
        }

        button,
        select,
        input {
            font-size: 16px;
        }

        button {
            min-height: 40px;
            padding: 8px 14px;
            border: 1px solid #b8c0ca;
            border-radius: 6px;
            background-color: #fff;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background-color: #f0f3f6;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        select,
        input[type="number"] {
            min-height: 40px;
            padding: 7px 10px;
            border: 1px solid #b8c0ca;
            border-radius: 6px;
            background-color: #fff;
        }

        input[type="range"] {
            width: 210px;
            margin: 0;
            padding: 0;
        }

        input[type="checkbox"] {
            width: 17px;
            height: 17px;
            margin: 0;
            vertical-align: middle;
        }

        .input-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 12px;
            font-size: 14px;
        }

        .blind-control {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        #readingProgress {
            color: #66707c;
            font-size: 14px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 28px;
            align-items: start;
        }

        .setting-block {
            padding: 14px;
            border: 1px solid #e1e5ea;
            border-radius: 8px;
            background-color: #fafbfc;
        }

        .setting-row {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 46px;
        }

        .setting-row + .setting-row {
            margin-top: 6px;
        }

        .setting-label {
            min-width: 145px;
            text-align: left;
            font-weight: bold;
        }

        #repeatCount {
            width: 78px;
        }

        #dialogDelayValue,
        #wordDelayValue,
        #rateValue {
            display: inline-block;
            min-width: 58px;
            color: #555;
            text-align: right;
        }

        .voice-section {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #e2e6eb;
        }

        .voice-row {
            display: grid;
            grid-template-columns: 90px minmax(0, 1fr);
            align-items: center;
            gap: 10px;
        }

        .voice-row + .voice-row {
            margin-top: 10px;
        }

        .speaker-label {
            font-weight: bold;
            text-align: right;
        }

        .voice-row select {
            width: 100%;
        }

        .control-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .control-group + .control-group {
            margin-top: 10px;
        }

        .primary-controls button {
            min-width: 110px;
        }

        .secondary-controls button {
            min-width: 92px;
        }

        .weak-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .weak-only-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        #weakCount {
            color: #66707c;
            font-size: 14px;
        }

        .weak-list-panel {
            display: none;
            width: 100%;
            margin: 16px auto 0;
            padding: 12px 14px;
            border: 1px solid #d9dee5;
            border-radius: 8px;
            text-align: left;
            background-color: #f8f9fb;
        }

        .weak-list-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid #e2e6eb;
        }

        .weak-list-item:last-child {
            border-bottom: 0;
        }

        .weak-list-text {
            flex: 1;
            word-break: break-word;
        }

        .weak-list-remove {
            min-height: 32px;
            padding: 4px 8px;
            font-size: 14px;
            white-space: nowrap;
        }

        .current-card {
            text-align: left;
        }

        .current-display {
            min-height: 58px;
            display: flex;
            align-items: center;
            padding: 12px 14px;
            border: 1px solid #d9dee5;
            border-radius: 8px;
            background-color: #f8f9fb;
        }

        #currentWordDisplay {
            width: 100%;
            margin: 0;
            font-size: 20px;
            line-height: 1.5;
        }

        .highlight {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 5px;
            background-color: blue;
            color: white;
        }

        @media (max-width: 760px) {
            body {
                padding: 16px 10px 32px;
            }

            .app-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            .setting-row {
                align-items: flex-start;
                flex-direction: column;
                gap: 6px;
            }

            .setting-label {
                min-width: 0;
            }

            input[type="range"] {
                width: 100%;
            }

            .voice-row {
                grid-template-columns: 1fr;
            }

            .speaker-label {
                text-align: left;
            }

            .input-meta {
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
            }

            .control-group {
                justify-content: stretch;
            }

            .control-group button {
                flex: 1 1 140px;
            }
        }


    </style>
</head>

<body>

    <div class="app-container">

        <div class="app-header">

            <h1>英文朗讀工具</h1>

            <div class="mode-control">
                <label for="modeSelect">模式：</label>

                <select id="modeSelect">
                    <option value="word">單字模式</option>
                    <option value="dialog">對話模式</option>
                </select>
            </div>

        </div>


        <section class="card">

            <textarea
                id="textInput"
                placeholder="每行輸入一個單字或句子..."></textarea>

            <div class="input-meta">

                <label class="blind-control">
                    <input
                        type="checkbox"
                        id="blindMode">
                    <span>盲聽模式</span>
                </label>

                <span id="readingProgress">
                    第 0 / 0 句（剩餘 0 句）
                </span>

            </div>

        </section>


        <section class="card">

            <h2 class="card-title">
                朗讀設定
            </h2>

            <div class="settings-grid">

                <div class="setting-block">

                    <div id="repeatSetting">

                        <div class="setting-row">

                            <label
                                class="setting-label"
                                for="repeatCount">
                                每個單字朗讀次數
                            </label>

                            <input
                                type="number"
                                id="repeatCount"
                                min="1"
                                max="10"
                                value="3">

                        </div>

                        <div class="setting-row">

                            <label
                                class="setting-label"
                                for="wordDelay">
                                單字朗讀間隔
                            </label>

                            <input
                                type="range"
                                id="wordDelay"
                                min="0"
                                max="1000"
                                step="100"
                                value="0">

                            <span id="wordDelayValue">
                                0 ms
                            </span>

                        </div>

                    </div>


                    <div
                        id="dialogSetting"
                        style="display: none;">

                        <div class="setting-row">

                            <label
                                class="setting-label"
                                for="dialogDelay">
                                額外對話間隔
                            </label>

                            <input
                                type="range"
                                id="dialogDelay"
                                min="0"
                                max="1000"
                                step="100"
                                value="0">

                            <span id="dialogDelayValue">
                                0 ms
                            </span>

                        </div>

                    </div>

                </div>


                <div class="setting-block">

                    <div class="setting-row">

                        <label
                            class="setting-label"
                            for="rateSelect">
                            語速
                        </label>

                        <input
                            type="range"
                            id="rateSelect"
                            min="0.5"
                            max="2.0"
                            step="0.1"
                            value="0.9">

                        <span id="rateValue">
                            0.9x
                        </span>

                    </div>

                </div>

            </div>


            <div class="voice-section">

                <div class="voice-row">

                    <span class="speaker-label">
                        A 聲音：
                    </span>

                    <select
                        id="voiceASelect"
                        onchange="changeVoiceA()">
                    </select>

                </div>

                <div class="voice-row">

                    <span class="speaker-label">
                        B 聲音：
                    </span>

                    <select
                        id="voiceBSelect"
                        onchange="changeVoiceB()">
                    </select>

                </div>

            </div>

        </section>


        <section class="card">

            <h2 class="card-title">
                播放控制
            </h2>

            <div class="control-group primary-controls">

                <button onclick="startSpeaking()">
                    開始朗讀
                </button>

                <button onclick="togglePause()">
                    暫停 / 繼續
                </button>

                <button onclick="stopSpeaking()">
                    停止
                </button>

            </div>

            <div class="control-group secondary-controls">

                <button onclick="previousLine()">
                    上一句
                </button>

                <button onclick="nextLine()">
                    下一句
                </button>

                <button
                    id="shuffleButton"
                    onclick="shuffleWords()">
                    隨機排序
                </button>

                <button onclick="clearInput()">
                    清除輸入
                </button>

                <button
                    id="toggleHighlightBtn"
                    onclick="toggleHighlight()">
                    顯示目前朗讀內容
                </button>

            </div>

        </section>


        <section class="card">

            <h2 class="card-title">
                弱項清單
            </h2>

            <div class="weak-toolbar">

                <button onclick="addCurrentToWeakList()">
                    加入弱項
                </button>

                <label class="weak-only-label">
                    <input
                        type="checkbox"
                        id="weakOnlyMode">
                    <span>
                        只唸弱項清單
                    </span>
                </label>

                <span id="weakCount">
                    弱項：0
                </span>

                <button
                    id="toggleWeakListBtn"
                    onclick="toggleWeakList()">
                    查看弱項清單
                </button>

            </div>

            <div
                id="weakListPanel"
                class="weak-list-panel">

                <div id="weakListContent"></div>

                <div style="text-align: right; margin-top: 10px;">
                    <button
                        id="clearWeakListBtn"
                        onclick="clearWeakList()">
                        清空全部
                    </button>
                </div>

            </div>

        </section>


        <section class="card current-card">

            <h2 class="card-title">
                目前朗讀
            </h2>

            <div class="current-display">
                <p id="currentWordDisplay"></p>
            </div>

        </section>

    </div>

    <script src="./sentence_bank.js"></script>
    <script>

        // =========================================================
        // Global Variables

        const synth =
            window.speechSynthesis;

        let voices = [];

        let selectedVoiceA = null;
        let selectedVoiceB = null;

        let lines = [];

		let lineSpeakers = [];

		let weakItems = [];

        let currentIndex = 0;

        let isSpeaking = false;
        let isPaused = false;

        let isHighlightEnabled = false;

        /*
            每次重新開始或停止時增加。

            用途：
            防止上一輪朗讀留下來的 setTimeout()
            在新的朗讀流程中又被執行。
        */
        let speechSessionId = 0;

		
		// =========================================================
		// Load Sentence Bank

		function loadSentenceBank() {

    		if (!Array.isArray(sentenceBank)) {
        		return;
    		}

    		document.getElementById("textInput").value =sentenceBank.join("\n");
		}
		
		
		// =========================================================
		// Load Weak Items

		try {

    		const savedWeakItems =
        		localStorage.getItem(
            		"weakItems"
        	);


    	if (savedWeakItems) {

        		weakItems =
            		JSON.parse(
                		savedWeakItems
            );
    		}

		}
		catch (error) {

    		console.error(
        		"Load weak items failed:",
        		error
    		);

    		weakItems = [];
		}


        // =========================================================
        // Voice

        function loadVoices() {

            const allVoices =
                synth.getVoices();

            /*
                主要保留美式英文（en-US），
                另外保留英式英文 Daniel（en-GB）。

                某些瀏覽器可能回傳大小寫略有不同，
                所以統一轉小寫比較。
            */
            voices =
                allVoices.filter(
                    voice => {

                        if (!voice.lang) {
                            return false;
                        }


                        const lang =
                            voice.lang.toLowerCase();


                        const isUsEnglish =
                            lang.startsWith(
                                "en-us"
                            );


                        const isBritishDaniel =
                            lang.startsWith(
                                "en-gb"
                            ) &&
                            containsIgnoreCase(
                                voice.name,
                                "Daniel"
                            );


                        return (
                            isUsEnglish ||
                            isBritishDaniel
                        );
                    }
                );


            if (voices.length === 0) {

                selectedVoiceA = null;
                selectedVoiceB = null;

                updateVoiceDisplay();

                return;
            }


            // -----------------------------------------------------
            // A - Male

            const maleNames = [
                // Microsoft / Windows
				"Guy",
                "Andrew",
                "Brian",
                "Davis",
                "Christopher",
                "Eric",
                "Jason",
                "Roger",
                "Tony",
				
				// Apple / iPhone / Safari
				"Aaron",
				"Fred",
				"Alex"
            ];


            // -----------------------------------------------------
            // B - Female

            const femaleNames = [
                "Jenny",
                "Aria",
                "Ava",
                "Emma",
                "Michelle",
                "Sara",
                "Nancy",
                "Jane",
				
				// Apple / iPhone / Safari
				"Samantha",
				"Nicky",
				"Victoria"
            ];


            selectedVoiceA =
                voices.find(
                    voice =>
                        voice.lang &&
                        voice.lang.toLowerCase().startsWith(
                            "en-us"
                        ) &&
                        containsIgnoreCase(
                            voice.name,
                            "Samantha"
                        )
                ) ||
                findBestNaturalVoice(
                    voices,
                    maleNames
                );


            selectedVoiceB =
                voices.find(
                    voice =>
                        voice.lang &&
                        voice.lang.toLowerCase().startsWith(
                            "en-gb"
                        ) &&
                        containsIgnoreCase(
                            voice.name,
                            "Daniel"
                        )
                ) ||
                findBestNaturalVoice(
                    voices,
                    femaleNames
                );


            if (!selectedVoiceA) {

                selectedVoiceA =
                    voices[0];
            }


            if (!selectedVoiceB) {

                selectedVoiceB =
                    voices.find(
                        voice =>
                            voice !== selectedVoiceA
                    ) || voices[0];
            }
				
            updateVoiceDisplay();


            console.log(
                "Available en-US voices:",
                voices
            );

            console.log(
                "A Dialog Voice:",
                selectedVoiceA?.name
            );

            console.log(
                "B Dialog Voice:",
                selectedVoiceB?.name
            );
        }


        // =========================================================
        // Find Best Voice

        function findBestNaturalVoice(
            voiceList,
            preferredNames) {

            // -----------------------------------------------------
            // Priority 1
            // Online + Natural + Preferred Person

            for (const personName of preferredNames) {

                const voice =
                    voiceList.find(
                        v =>
                            containsIgnoreCase(
                                v.name,
                                personName
                            ) &&
                            containsIgnoreCase(
                                v.name,
                                "Natural"
                            ) &&
                            containsIgnoreCase(
                                v.name,
                                "Online"
                            )
                    );

                if (voice) {
                    return voice;
                }
            }


            // -----------------------------------------------------
            // Priority 2
            // Natural + Preferred Person

            for (const personName of preferredNames) {

                const voice =
                    voiceList.find(
                        v =>
                            containsIgnoreCase(
                                v.name,
                                personName
                            ) &&
                            containsIgnoreCase(
                                v.name,
                                "Natural"
                            )
                    );

                if (voice) {
                    return voice;
                }
            }


            // -----------------------------------------------------
            // Priority 3
            // Preferred Person

            for (const personName of preferredNames) {

                const voice =
                    voiceList.find(
                        v =>
                            containsIgnoreCase(
                                v.name,
                                personName
                            )
                    );

                if (voice) {
                    return voice;
                }
            }

            return null;
        }


        // =========================================================
        // Case-insensitive Contains

        function containsIgnoreCase(
            source,
            target) {

            if (!source || !target) {
                return false;
            }

            return source
                .toLowerCase()
                .includes(
                    target.toLowerCase()
                );
        }


        // =========================================================
        // Voice Display
function updateVoiceDisplay() {

    const voiceASelect =
        document.getElementById(
            "voiceASelect"
        );

    const voiceBSelect =
        document.getElementById(
            "voiceBSelect"
        );


    voiceASelect.innerHTML = "";
    voiceBSelect.innerHTML = "";


    if (voices.length === 0) {

        const optionA =
            document.createElement(
                "option"
            );

        optionA.textContent =
            "找不到美式英文 Voice";

        voiceASelect.appendChild(
            optionA
        );


        const optionB =
            document.createElement(
                "option"
            );

        optionB.textContent =
            "找不到美式英文 Voice";

        voiceBSelect.appendChild(
            optionB
        );

        return;
    }


    voices.forEach(
        function (
            voice,
            index) {

            const optionA =
                document.createElement(
                    "option"
                );

            optionA.value =
                index;

            optionA.textContent =
                voice.name;

            voiceASelect.appendChild(
                optionA
            );


            const optionB =
                document.createElement(
                    "option"
                );

            optionB.value =
                index;

            optionB.textContent =
                voice.name;

            voiceBSelect.appendChild(
                optionB
            );
        }
    );


    const voiceAIndex =
        voices.indexOf(
            selectedVoiceA
        );

    const voiceBIndex =
        voices.indexOf(
            selectedVoiceB
        );


    if (voiceAIndex >= 0) {

        voiceASelect.value =
            voiceAIndex;
    }


    if (voiceBIndex >= 0) {

        voiceBSelect.value =
            voiceBIndex;
    }
}

		function changeVoiceA() {

    const index =
        parseInt(
            document.getElementById(
                "voiceASelect"
            ).value,
            10
        );


    if (Number.isNaN(index) ||
        !voices[index]) {

        return;
    }


    selectedVoiceA =
        voices[index];
}


function changeVoiceB() {

    const index =
        parseInt(
            document.getElementById(
                "voiceBSelect"
            ).value,
            10
        );


    if (Number.isNaN(index) ||
        !voices[index]) {

        return;
    }


    selectedVoiceB =
        voices[index];
}

		// =========================================================
		// Reading Progress

		function updateReadingProgress() {

    		const progress =
        		document.getElementById(
            		"readingProgress"
        		);


    		if (lines.length === 0) {

        		progress.textContent =
            		"第 0 / 0 句（剩餘 0 句）";

        		return;
    		}


    		if (currentIndex >= lines.length) {

        		progress.textContent =
            		"第 " +
            		lines.length +
            		" / " +
            		lines.length +
            		" 句（剩餘 0 句）";

        		return;
    		}


    		const currentNumber =
        		currentIndex + 1;

    		const remaining =
        		lines.length -
        		currentNumber;

    		progress.textContent =
        		"第 " +
        		currentNumber +
        		" / " +
        		lines.length +
        		" 句（剩餘 " +
        		remaining +
        		" 句）";
		}


        // =========================================================
        // Load Voices

        synth.onvoiceschanged =
            loadVoices;

        loadVoices();


        /*
            Chrome / Edge 有時第一次 getVoices()
            會回傳空陣列。

            再稍後讀取一次。
        */
        setTimeout(
            loadVoices,
            500
        );


        updateWeakCount();


        // =========================================================
        // Start Speaking

        function startSpeaking() {

            const mode =
                document.getElementById(
                    "modeSelect"
                ).value;


            const activeItems =
                getActiveItems();


            if (activeItems.length === 0) {

                const weakOnly =
                    document.getElementById(
                        "weakOnlyMode"
                    ).checked;


                alert(
                    weakOnly
                        ? "目前沒有弱項。"
                        : "請輸入文字！"
                );

                return;
            }


            if (!selectedVoiceA ||
                !selectedVoiceB) {

                loadVoices();
            }


            if (!selectedVoiceA) {

                alert(
                    "找不到適合的英文男性 Voice。"
                );

                return;
            }


            if (mode === "dialog" &&
                !selectedVoiceB) {

                alert(
                    "找不到適合的英文女性 Voice。"
                );

                return;
            }


            /*
                終止上一輪朗讀。
            */
            synth.cancel();

            speechSessionId++;

            const currentSessionId =
                speechSessionId;


            lines =
                activeItems.map(
                    item =>
                        item.text
                );


            lineSpeakers =
                activeItems.map(
                    item =>
                        item.speaker
                );


            currentIndex = 0;

			updateReadingProgress();

            isPaused = false;
            isSpeaking = true;


            speakNext(
                currentSessionId
            );
        }

		// =========================================================
		// Clear Input
		
		function clearInput() {
    		stopSpeaking();

    		document.getElementById("textInput").value = "";
		}

        // =========================================================
        // Speak Next

        function speakNext(
            sessionId) {

            if (sessionId !== speechSessionId) {
                return;
            }


            if (!isSpeaking) {
                return;
            }


            if (isPaused) {
                return;
            }


            if (currentIndex >= lines.length) {

                isSpeaking = false;

                clearHighlight();

                return;
            }


            const mode =
                document.getElementById(
                    "modeSelect"
                ).value;


            if (mode === "dialog") {

                const delay =
                    getDialogDelay();

                /*
                    0 ms：一次把剩餘對話全部排入
                    speechSynthesis Queue，讓 A/B 銜接最快。

                    > 0 ms：保留原本逐句播放方式，
                    才能插入指定的額外停頓。
                */
                if (delay === 0) {

                    queueDialog(
                        sessionId
                    );

                }
                else {

                    speakDialogLine(
                        sessionId
                    );
                }

            }
            else {

                speakWordLine(
                    sessionId
                );
            }
        }


        // =========================================================
        // Word Mode

        function speakWordLine(
            sessionId) {

            const text =
                lines[currentIndex];


            let repeatCount =
                parseInt(
                    document.getElementById(
                        "repeatCount"
                    ).value,
                    10
                );


            if (Number.isNaN(repeatCount) ||
                repeatCount < 1) {

                repeatCount = 1;
            }


            speakRepeatedly(
                text,
                repeatCount,
                selectedVoiceA,
                getWordDelay(),
                sessionId,
                function () {

                    if (sessionId !== speechSessionId) {
                        return;
                    }

                    currentIndex++;

                    speakNext(
                        sessionId
                    );
                }
            );
        }


        // =========================================================
        // Repeat Word

        function speakRepeatedly(
            text,
            count,
            voice,
            delay,
            sessionId,
            callback) {

            if (sessionId !== speechSessionId) {
                return;
            }


            if (!isSpeaking ||
                isPaused) {

                return;
            }


            if (count <= 0) {

                callback();

                return;
            }


            speakText(
                text,
                voice,
                sessionId,
                null,
                function () {

                    if (sessionId !== speechSessionId) {
                        return;
                    }


                    if (!isSpeaking ||
                        isPaused) {

                        return;
                    }


                    setTimeout(
                        function () {

                            if (sessionId !== speechSessionId) {
                                return;
                            }

                            speakRepeatedly(
                                text,
                                count - 1,
                                voice,
                                delay,
                                sessionId,
                                callback
                            );

                        },
                        delay
                    );
                }
            );
        }

		// =========================================================
		// Word Delay

		function getWordDelay() {

    		const delay =
        		parseInt(
            		document.getElementById(
                		"wordDelay"
            		).value,
            		10
        		);


    		return Number.isNaN(delay)
        		? 0
        		: delay;
		}


        // =========================================================
        // Dialog Delay

        function getDialogDelay() {

            const delay =
                parseInt(
                    document.getElementById(
                        "dialogDelay"
                    ).value,
                    10
                );

            return Number.isNaN(delay)
                ? 0
                : delay;
        }


        // =========================================================
        // Dialog Queue Mode

        function queueDialog(
            sessionId) {

            if (sessionId !== speechSessionId) {
                return;
            }


            if (!isSpeaking ||
                isPaused) {

                return;
            }


            if (currentIndex >= lines.length) {

                isSpeaking = false;

                clearHighlight();

                return;
            }


            const startIndex =
                currentIndex;

            const rate =
                parseFloat(
                    document.getElementById(
                        "rateSelect"
                    ).value
                );


            for (
                let index = startIndex;
                index < lines.length;
                index++
            ) {

                const text =
                    lines[index];

                const speaker =
                    lineSpeakers[index] ||
                    (
                        index % 2 === 0
                            ? "A"
                            : "B"
                    );

                const isSpeakerA =
                    speaker === "A";

                const voice =
                    isSpeakerA
                        ? selectedVoiceA
                        : selectedVoiceB;

                const utterance =
                    new SpeechSynthesisUtterance(
                        text
                    );


                utterance.voice =
                    voice;

                utterance.lang =
                    "en-US";

                utterance.pitch =
                    1.0;

                utterance.rate =
                    rate;

                utterance.volume =
                    1.0;


                utterance.onstart =
                    function () {

                        if (sessionId !== speechSessionId ||
                            !isSpeaking ||
                            isPaused) {

                            return;
                        }


                        currentIndex =
                            index;

						updateReadingProgress();

                        if (isHighlightEnabled) {

                            highlightCurrentText(
                                text,
                                speaker
                            );

                        }
                        else {

                            clearHighlight();
                        }
                    };


                utterance.onend =
                    function () {

                        if (sessionId !== speechSessionId ||
                            !isSpeaking ||
                            isPaused) {

                            return;
                        }


                        if (index === lines.length - 1) {

                            currentIndex =
                                lines.length;

                            isSpeaking =
                                false;

                            clearHighlight();

                        }
                        else {

                            currentIndex =
                                index + 1;
                        }
                    };


                utterance.onerror =
                    function (event) {

                        if (event.error === "interrupted" ||
                            event.error === "canceled") {

                            return;
                        }


                        console.error(
                            "Speech error:",
                            event.error
                        );
                    };


                synth.speak(
                    utterance
                );
            }
        }


        // =========================================================
        // Dialog Mode With Extra Delay

        function speakDialogLine(
            sessionId) {

            const text =
                lines[currentIndex];


            /*
                Line 0 → A
                Line 1 → B
                Line 2 → A
                Line 3 → B
                ...
            */

            const speaker =
                lineSpeakers[currentIndex] ||
                (
                    currentIndex % 2 === 0
                        ? "A"
                        : "B"
                );


            const isSpeakerA =
                speaker === "A";


            const voice =
                isSpeakerA
                    ? selectedVoiceA
                    : selectedVoiceB;


            speakText(
                text,
                voice,
                sessionId,
                speaker,
                function () {

                    if (sessionId !== speechSessionId) {
                        return;
                    }


                    if (!isSpeaking ||
                        isPaused) {

                        return;
                    }


                    currentIndex++;


                    const delay =
                        getDialogDelay();


                    if (delay === 0) {

                        speakNext(
                            sessionId
                        );

                    }
                    else {

                        setTimeout(
                            function () {

                                if (sessionId !== speechSessionId) {
                                    return;
                                }

                                speakNext(
                                    sessionId
                                );

                            },
                            delay
                        );
                    }
                }
            );
        }


        // =========================================================
        // Common Speech Function

        function speakText(
            text,
            voice,
            sessionId,
            speaker,
            callback) {

            if (sessionId !== speechSessionId) {
                return;
            }


            const utterance =
                new SpeechSynthesisUtterance(
                    text
                );


            utterance.voice =
                voice;


            /*
                強制美式英文。
            */
            utterance.lang =
                "en-US";


            /*
                不人工改變男女聲 Pitch。

                Natural Voice 本身已經包含
                原本男性 / 女性的聲音特徵。
            */
            utterance.pitch =
                1.0;


            /*
                即時取得目前語速。
            */
            utterance.rate =
                parseFloat(
                    document.getElementById(
                        "rateSelect"
                    ).value
                );


            utterance.volume =
                1.0;


            // -----------------------------------------------------
            // Start

            utterance.onstart =
                function () {

                    if (sessionId !== speechSessionId) {
                        return;
                    }

					updateReadingProgress();

                    if (isHighlightEnabled) {

                        highlightCurrentText(
                            text,
                            speaker
                        );

                    }
                    else {

                        clearHighlight();
                    }
                };


            // -----------------------------------------------------
            // End

            utterance.onend =
                function () {

                    if (sessionId !== speechSessionId) {
                        return;
                    }


                    if (callback) {
                        callback();
                    }
                };


            // -----------------------------------------------------
            // Error

            utterance.onerror =
                function (event) {

                    /*
                        cancel() 可能會產生
                        interrupted / canceled，
                        這種不用跳錯誤。
                    */

                    if (event.error === "interrupted" ||
                        event.error === "canceled") {

                        return;
                    }


                    console.error(
                        "Speech error:",
                        event.error
                    );
                };


            synth.speak(
                utterance
            );
        }

		// =========================================================
		// Previous / Next

		function previousLine() {

    		moveToLine(
        		-1
    		);
		}


		function nextLine() {

    		moveToLine(
        		1
    		);
		}


        function moveToLine(
            offset) {

            const activeItems =
                getActiveItems();


            if (activeItems.length === 0) {
                return;
            }


            lines =
                activeItems.map(
                    item =>
                        item.text
                );


            lineSpeakers =
                activeItems.map(
                    item =>
                        item.speaker
                );


            let targetIndex;


            /*
                如果已經整段播放完，
                currentIndex 會等於 lines.length。

                此時按上一句，
                回到最後一句。
            */
            if (currentIndex >= lines.length) {

                if (offset < 0) {

                    targetIndex =
                        lines.length - 1;

                }
                else {

                    return;
                }

            }
            else {

                targetIndex =
                    currentIndex +
                    offset;
            }


            /*
                已經在第一句 / 最後一句，
                就不要超出去。
            */
            if (targetIndex < 0 ||
                targetIndex >= lines.length) {

                return;
            }


            synth.cancel();

            speechSessionId++;


            currentIndex =
                targetIndex;

            isPaused =
                false;

            isSpeaking =
                true;


            const currentSessionId =
                speechSessionId;


            speakNext(
                currentSessionId
            );
        }


        // =========================================================
        // Weak List

function addCurrentToWeakList() {

    if (currentIndex < 0 ||
        currentIndex >= lines.length) {

        return;
    }


    const mode =
        document.getElementById(
            "modeSelect"
        ).value;


    let speaker = null;


    if (mode === "dialog") {

        speaker =
            lineSpeakers[currentIndex] ||
            (
                currentIndex % 2 === 0
                    ? "A"
                    : "B"
            );
    }


    const text =
        lines[currentIndex];


    const alreadyExists =
        weakItems.some(
            item =>
                item.text === text &&
                item.mode === mode &&
                item.speaker === speaker
        );


    if (alreadyExists) {

        return;
    }


    weakItems.push({
        text:
            text,

        mode:
            mode,

        speaker:
            speaker
    });


    saveWeakItems();

    updateWeakCount();
}


function saveWeakItems() {

    localStorage.setItem(
        "weakItems",
        JSON.stringify(
            weakItems
        )
    );
}


function updateWeakCount() {

    document
        .getElementById(
            "weakCount"
        )
        .textContent =
            "弱項：" +
            weakItems.length;


    const panel =
        document.getElementById(
            "weakListPanel"
        );


    if (panel &&
        panel.style.display !== "none") {

        renderWeakList();
    }
}


function toggleWeakList() {

    const panel =
        document.getElementById(
            "weakListPanel"
        );

    const button =
        document.getElementById(
            "toggleWeakListBtn"
        );


    const isOpen =
        panel.style.display === "block";


    if (isOpen) {

        panel.style.display =
            "none";

        button.textContent =
            "查看弱項清單";

        return;
    }


    renderWeakList();

    panel.style.display =
        "block";

    button.textContent =
        "隱藏弱項清單";
}


function renderWeakList() {

    const container =
        document.getElementById(
            "weakListContent"
        );

    const clearButton =
        document.getElementById(
            "clearWeakListBtn"
        );


    container.innerHTML =
        "";


    if (weakItems.length === 0) {

        const emptyMessage =
            document.createElement(
                "div"
            );

        emptyMessage.textContent =
            "目前沒有弱項。";

        container.appendChild(
            emptyMessage
        );

        clearButton.disabled =
            true;

        return;
    }


    clearButton.disabled =
        false;


    weakItems.forEach(
        function (
            item,
            index) {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "weak-list-item";


            const textSpan =
                document.createElement(
                    "span"
                );

            textSpan.className =
                "weak-list-text";


            let prefix =
				item.mode === "dialog"? "[" +(item.speaker || "?") +"] " : "";

            textSpan.textContent =
                (index + 1) +
                ". " +
                prefix +
                item.text;


            const removeButton =
                document.createElement(
                    "button"
                );

            removeButton.className =
                "weak-list-remove";

            removeButton.textContent =
                "移除";

            removeButton.onclick =
                function () {

                    removeWeakItem(
                        index
                    );
                };


            row.appendChild(
                textSpan
            );

            row.appendChild(
                removeButton
            );

            container.appendChild(
                row
            );
        }
    );
}


function removeWeakItem(
    index) {

    if (index < 0 ||
        index >= weakItems.length) {

        return;
    }


    weakItems.splice(
        index,
        1
    );

    saveWeakItems();
    updateWeakCount();


    if (document
            .getElementById(
                "weakOnlyMode"
            )
            .checked) {

        stopSpeaking();
    }
}


function clearWeakList() {

    if (weakItems.length === 0) {
        return;
    }


    const confirmed =
        confirm(
            "確定要清空所有弱項嗎？"
        );


    if (!confirmed) {
        return;
    }


    weakItems = [];

    saveWeakItems();
    updateWeakCount();


    if (document
            .getElementById(
                "weakOnlyMode"
            )
            .checked) {

        stopSpeaking();
    }
}


		function getActiveItems() {

    		const mode =
        		document.getElementById(
            		"modeSelect"
        		).value;


    		const weakOnly =
        		document.getElementById(
            		"weakOnlyMode"
        		).checked;


    		if (weakOnly) {

        		return weakItems.filter(
            		item =>
                		item.mode === mode
        		);
    		}


    		const text =
        		document
            		.getElementById(
                		"textInput"
            		)
            		.value
            		.trim();


    		if (!text) {

        		return [];
    		}


    		return text
        		.split(/\r?\n/)
        		.map(
            		line =>
                		line.trim()
        		)
        		.filter(
            		line =>
                		line.length > 0
        		)
        		.map(
            		function (
                		line,
                		index) {

                		return {

                    		text:
                        		line,

                    		mode:
                        		mode,

                    		speaker:
                        		mode === "dialog"
                            		? (
                                		index % 2 === 0
                                    		? "A"
                                    		: "B"
                            		)
                            		: null
                		};
            		}
        		);
		}
		
		
		// =========================================================
        // Pause / Resume

        function togglePause() {

            if (!isSpeaking) {
                return;
            }


            if (isPaused) {

                /*
                    目前採用：
                    暫停後重新從目前這一句開始。

                    相較 speechSynthesis.resume()
                    在 Chrome / Edge 上比較穩定。
                */

                isPaused = false;

                const currentSessionId =
                    speechSessionId;

                speakNext(
                    currentSessionId
                );

            }
            else {

                isPaused = true;

                /*
                    cancel() 會停止目前正在講的內容。

                    Resume 時會重新朗讀目前這一句。
                */
                synth.cancel();
            }
        }


        // =========================================================
        // Stop

        function stopSpeaking() {

            speechSessionId++;

            synth.cancel();

            isSpeaking = false;

            isPaused = false;

            currentIndex = 0;

			lines = [];
    		lineSpeakers = [];

            clearHighlight();

			updateReadingProgress();
        }


        // =========================================================
        // Shuffle

        function shuffleWords() {

            const mode =
                document.getElementById(
                    "modeSelect"
                ).value;


            /*
                對話不能 Shuffle。

                否則 A/B 對話順序會完全被破壞。
            */
            if (mode === "dialog") {

                alert(
                    "對話模式不能隨機排序。"
                );

                return;
            }


            const text =
                document
                    .getElementById(
                        "textInput"
                    )
                    .value
                    .trim();


            if (!text) {

                alert(
                    "請先輸入單字！"
                );

                return;
            }


            const tempLines =
                text
                    .split(/\r?\n/)
                    .map(
                        line =>
                            line.trim()
                    )
                    .filter(
                        line =>
                            line.length > 0
                    );


            /*
                Fisher-Yates Shuffle
            */
            for (
                let i =
                    tempLines.length - 1;

                i > 0;

                i--
            ) {

                const j =
                    Math.floor(
                        Math.random() *
                        (i + 1)
                    );


                [
                    tempLines[i],
                    tempLines[j]
                ] =
                [
                    tempLines[j],
                    tempLines[i]
                ];
            }


            document.getElementById(
                "textInput"
            ).value =
                tempLines.join(
                    "\n"
                );
        }


        // =========================================================
        // Highlight

        function toggleHighlight() {

            isHighlightEnabled =
                !isHighlightEnabled;


            const button =
                document.getElementById(
                    "toggleHighlightBtn"
                );


            button.textContent =
                isHighlightEnabled
                    ? "隱藏目前朗讀內容"
                    : "顯示目前朗讀內容";


            if (!isHighlightEnabled) {
                clearHighlight();
            }
        }


        // =========================================================
        // Highlight Current Text

        function highlightCurrentText(
            text,
            speaker) {

            const display =
                document.getElementById(
                    "currentWordDisplay"
                );


            let displayText =
                escapeHtml(
                    text
                );


            if (speaker) {

                displayText =
                    "<strong>" +
                    speaker +
                    "：</strong> " +
                    displayText;
            }


            display.innerHTML =
                '<span class="highlight">' +
                displayText +
                "</span>";
        }


        // =========================================================
        // Clear Highlight

        function clearHighlight() {

            document.getElementById(
                "currentWordDisplay"
            ).innerHTML =
                "";
        }


        // =========================================================
        // Escape HTML

        function escapeHtml(
            text) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                text;

            return div.innerHTML;
        }
        // =========================================================
        // Weak Only Mode

        document
            .getElementById(
                "weakOnlyMode"
            )
            .addEventListener(
                "change",
                function () {

                    stopSpeaking();
                }
            );

		// =========================================================
        // Load Sentence at Index
        
		document.addEventListener("DOMContentLoaded",
    	function () {
        loadSentenceBank();
    	}
		);
		
		// =========================================================
        // Blind Listening Mode

		document
    		.getElementById(
        		"blindMode"
    		)
    		.addEventListener(
        		"change",
        		function () {

            		const textInput =
                		document.getElementById(
                    		"textInput"
                		);


            		textInput.classList.toggle(
                		"blind-mode",
                		this.checked
            		);
        		}
    		);

        // =========================================================
        // Rate Slider

        document
            .getElementById(
                "rateSelect"
            )
            .addEventListener(
                "input",
                function () {

                    document
                        .getElementById(
                            "rateValue"
                        )
                        .textContent =
                            parseFloat(
                                this.value
                            ).toFixed(1) +
                            "x";
                }
            );

		// =========================================================
		// Word Delay Slider

		document
    		.getElementById(
        		"wordDelay"
    		)
    		.addEventListener(
        		"input",
        		function () {

            		document
                		.getElementById(
                    		"wordDelayValue"
                		)
                		.textContent =
                    		this.value +
                    		" ms";
        		}
    		);
		
        // =========================================================
        // Dialog Delay Slider

        document
            .getElementById(
                "dialogDelay"
            )
            .addEventListener(
                "input",
                function () {

                    document
                        .getElementById(
                            "dialogDelayValue"
                        )
                        .textContent =
                            this.value +
                            " ms";
                }
            );


        // =========================================================
        // Mode Change

        document
            .getElementById(
                "modeSelect"
            )
            .addEventListener(
                "change",
                function () {

                    /*
                        切換模式時停止目前朗讀。
                    */
                    stopSpeaking();


                    const isDialog =
                        this.value ===
                        "dialog";


                    // ---------------------------------------------
                    // Word Repeat

                    document
                        .getElementById(
                            "repeatSetting"
                        )
                        .style
                        .display =
                            isDialog
                                ? "none"
                                : "block";


                    // ---------------------------------------------
                    // Dialog Delay

                    document
                        .getElementById(
                            "dialogSetting"
                        )
                        .style
                        .display =
                            isDialog
                                ? "block"
                                : "none";


                    // ---------------------------------------------
                    // Shuffle Button

                    document
                        .getElementById(
                            "shuffleButton"
                        )
                        .disabled =
                            isDialog;


                    // ---------------------------------------------
                    // Placeholder

                    document
                        .getElementById(
                            "textInput"
                        )
                        .placeholder =
                            isDialog
                                ? "每行輸入一句對話，程式會自動以 A / B 交替朗讀..."
                                : "每行輸入一個單字或句子...";
                }
            );

    </script>
