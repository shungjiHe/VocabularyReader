<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文朗讀工具</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 28px 18px 48px;
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background-color: #f4f6f8;
            color: #222;
        }

        .app-container {
            width: min(1100px, 100%);
            margin: 0 auto;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 18px;
        }

        .app-header h1 {
            margin: 0;
            font-size: 28px;
        }

        .mode-control {
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .card {
            margin-bottom: 16px;
            padding: 20px;
            border: 1px solid #d9dee5;
            border-radius: 10px;
            background-color: #fff;
        }

        .card-title {
            margin: 0 0 14px;
            font-size: 18px;
            font-weight: bold;
            text-align: left;
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 12px 14px;
            border: 1px solid #bfc7d1;
            border-radius: 6px;
            font-size: 17px;
            line-height: 1.45;
            resize: vertical;
        }

        textarea.blind-mode {
            color: transparent;
            caret-color: transparent;
            -webkit-text-fill-color: transparent;
        }

        button,
        select,
        input {
            font-size: 16px;
        }

        button {
            min-height: 40px;
            padding: 8px 14px;
            border: 1px solid #b8c0ca;
            border-radius: 6px;
            background-color: #fff;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background-color: #f0f3f6;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        select,
        input[type="number"] {
            min-height: 40px;
            padding: 7px 10px;
            border: 1px solid #b8c0ca;
            border-radius: 6px;
            background-color: #fff;
        }

        input[type="range"] {
            width: 210px;
            margin: 0;
            padding: 0;
        }

        input[type="checkbox"] {
            width: 17px;
            height: 17px;
            margin: 0;
            vertical-align: middle;
        }

        .input-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 12px;
            font-size: 14px;
        }

        .blind-control {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        #readingProgress {
            color: #66707c;
            font-size: 14px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 28px;
            align-items: start;
        }

        .setting-block {
            padding: 14px;
            border: 1px solid #e1e5ea;
            border-radius: 8px;
            background-color: #fafbfc;
        }

        .setting-row {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 46px;
        }

        .setting-row + .setting-row {
            margin-top: 6px;
        }

        .setting-label {
            min-width: 145px;
            text-align: left;
            font-weight: bold;
        }

        #repeatCount {
            width: 78px;
        }

        #dialogDelayValue,
        #wordDelayValue,
        #rateValue {
            display: inline-block;
            min-width: 58px;
            color: #555;
            text-align: right;
        }

        .voice-section {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #e2e6eb;
        }

        .voice-row {
            display: grid;
            grid-template-columns: 90px minmax(0, 1fr);
            align-items: center;
            gap: 10px;
        }

        .voice-row + .voice-row {
            margin-top: 10px;
        }

        .speaker-label {
            font-weight: bold;
            text-align: right;
        }

        .voice-row select {
            width: 100%;
        }

        .control-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .control-group + .control-group {
            margin-top: 10px;
        }

        .primary-controls button {
            min-width: 110px;
        }

        .secondary-controls button {
            min-width: 92px;
        }

        .weak-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .weak-only-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        #weakCount {
            color: #66707c;
            font-size: 14px;
        }

        .weak-list-panel {
            display: none;
            width: 100%;
            margin: 16px auto 0;
            padding: 12px 14px;
            border: 1px solid #d9dee5;
            border-radius: 8px;
            text-align: left;
            background-color: #f8f9fb;
        }

        .weak-list-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid #e2e6eb;
        }

        .weak-list-item:last-child {
            border-bottom: 0;
        }

        .weak-list-text {
            flex: 1;
            word-break: break-word;
        }

        .weak-list-remove {
            min-height: 32px;
            padding: 4px 8px;
            font-size: 14px;
            white-space: nowrap;
        }

        .current-card {
            text-align: left;
        }

        .current-display {
            min-height: 58px;
            display: flex;
            align-items: center;
            padding: 12px 14px;
            border: 1px solid #d9dee5;
            border-radius: 8px;
            background-color: #f8f9fb;
        }

        #currentWordDisplay {
            width: 100%;
            margin: 0;
            font-size: 20px;
            line-height: 1.5;
        }

        .highlight {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 5px;
            background-color: blue;
            color: white;
        }

        @media (max-width: 760px) {
            body {
                padding: 16px 10px 32px;
            }

            .app-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .settings-grid {
                grid-template-columns: 1fr;
            }

            .setting-row {
                align-items: flex-start;
                flex-direction: column;
                gap: 6px;
            }

            .setting-label {
                min-width: 0;
            }

            input[type="range"] {
                width: 100%;
            }

            .voice-row {
                grid-template-columns: 1fr;
            }

            .speaker-label {
                text-align: left;
            }

            .input-meta {
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
            }

            .control-group {
                justify-content: stretch;
            }

            .control-group button {
                flex: 1 1 140px;
            }
        }


        /* ===================================================== */
        /* TTS Engine */

        .engine-block {
            grid-column: 1 / -1;
        }

        .engine-status {
            color: #66707c;
            font-size: 14px;
        }

        .engine-note {
            margin-top: 8px;
            color: #7a838d;
            font-size: 13px;
            line-height: 1.5;
            text-align: left;
        }

    </style>
</head>

<body>

    <div class="app-container">

        <div class="app-header">

            <h1>英文朗讀工具</h1>

            <div class="mode-control">
                <label for="modeSelect">模式：</label>

                <select id="modeSelect">
                    <option value="word">單字模式</option>
                    <option value="dialog">對話模式</option>
                </select>
            </div>

        </div>


        <section class="card">

            <textarea
                id="textInput"
                placeholder="每行輸入一個單字或句子..."></textarea>

            <div class="input-meta">

                <label class="blind-control">
                    <input
                        type="checkbox"
                        id="blindMode">
                    <span>盲聽模式</span>
                </label>

                <span id="readingProgress">
                    第 0 / 0 句（剩餘 0 句）
                </span>

            </div>

        </section>


        <section class="card">

            <h2 class="card-title">
                朗讀設定
            </h2>

            <div class="settings-grid">

                <div class="setting-block engine-block">

                    <div class="setting-row">

                        <label
                            class="setting-label"
                            for="ttsEngineSelect">
                            TTS 引擎
                        </label>

                        <select id="ttsEngineSelect">
                            <option value="auto">自動</option>
                            <option value="kokoro">Kokoro（本機）</option>
                            <option value="browser">瀏覽器 TTS</option>
                        </select>

                        <button
                            type="button"
                            id="loadKokoroBtn"
                            onclick="manualLoadKokoro()">
                            載入 Kokoro
                        </button>

                        <span
                            id="ttsStatus"
                            class="engine-status">
                            偵測中...
                        </span>

                    </div>

                    <div class="engine-note">
                        自動模式：iPhone / iPad 優先使用 Kokoro；其他裝置優先使用瀏覽器 TTS。
                        Kokoro 不會在開頁面時自動下載；請按「載入 Kokoro」或直接按「開始朗讀」。
                        iPhone / iPad 使用較小的 q8 + WASM 模型，下載完成後由瀏覽器快取。
                    </div>

                </div>

                <div class="setting-block">

                    <div id="repeatSetting">

                        <div class="setting-row">

                            <label
                                class="setting-label"
                                for="repeatCount">
                                每個單字朗讀次數
                            </label>

                            <input
                                type="number"
                                id="repeatCount"
                                min="1"
                                max="10"
                                value="3">

                        </div>

                        <div class="setting-row">

                            <label
                                class="setting-label"
                                for="wordDelay">
                                單字朗讀間隔
                            </label>

                            <input
                                type="range"
                                id="wordDelay"
                                min="0"
                                max="1000"
                                step="100"
                                value="0">

                            <span id="wordDelayValue">
                                0 ms
                            </span>

                        </div>

                    </div>


                    <div
                        id="dialogSetting"
                        style="display: none;">

                        <div class="setting-row">

                            <label
                                class="setting-label"
                                for="dialogDelay">
                                額外對話間隔
                            </label>

                            <input
                                type="range"
                                id="dialogDelay"
                                min="0"
                                max="1000"
                                step="100"
                                value="0">

                            <span id="dialogDelayValue">
                                0 ms
                            </span>

                        </div>

                    </div>

                </div>


                <div class="setting-block">

                    <div class="setting-row">

                        <label
                            class="setting-label"
                            for="rateSelect">
                            語速
                        </label>

                        <input
                            type="range"
                            id="rateSelect"
                            min="0.5"
                            max="2.0"
                            step="0.1"
                            value="0.9">

                        <span id="rateValue">
                            0.9x
                        </span>

                    </div>

                </div>

            </div>


            <div class="voice-section">

                <div class="voice-row">

                    <span class="speaker-label">
                        A 聲音：
                    </span>

                    <select
                        id="voiceASelect"
                        onchange="changeVoiceA()">
                    </select>

                </div>

                <div class="voice-row">

                    <span class="speaker-label">
                        B 聲音：
                    </span>

                    <select
                        id="voiceBSelect"
                        onchange="changeVoiceB()">
                    </select>

                </div>

            </div>

        </section>


        <section class="card">

            <h2 class="card-title">
                播放控制
            </h2>

            <div class="control-group primary-controls">

                <button onclick="startSpeaking()">
                    開始朗讀
                </button>

                <button onclick="togglePause()">
                    暫停 / 繼續
                </button>

                <button onclick="stopSpeaking()">
                    停止
                </button>

            </div>

            <div class="control-group secondary-controls">

                <button onclick="previousLine()">
                    上一句
                </button>

                <button onclick="nextLine()">
                    下一句
                </button>

                <button
                    id="shuffleButton"
                    onclick="shuffleWords()">
                    隨機排序
                </button>

                <button onclick="clearInput()">
                    清除輸入
                </button>

                <button
                    id="toggleHighlightBtn"
                    onclick="toggleHighlight()">
                    顯示目前朗讀內容
                </button>

            </div>

        </section>


        <section class="card">

            <h2 class="card-title">
                弱項清單
            </h2>

            <div class="weak-toolbar">

                <button onclick="addCurrentToWeakList()">
                    加入弱項
                </button>

                <label class="weak-only-label">
                    <input
                        type="checkbox"
                        id="weakOnlyMode">
                    <span>
                        只唸弱項清單
                    </span>
                </label>

                <span id="weakCount">
                    弱項：0
                </span>

                <button
                    id="toggleWeakListBtn"
                    onclick="toggleWeakList()">
                    查看弱項清單
                </button>

            </div>

            <div
                id="weakListPanel"
                class="weak-list-panel">

                <div id="weakListContent"></div>

                <div style="text-align: right; margin-top: 10px;">
                    <button
                        id="clearWeakListBtn"
                        onclick="clearWeakList()">
                        清空全部
                    </button>
                </div>

            </div>

        </section>


        <section class="card current-card">

            <h2 class="card-title">
                目前朗讀
            </h2>

            <div class="current-display">
                <p id="currentWordDisplay"></p>
            </div>

        </section>

    </div>

    <script src="./sentence_bank.js"></script>
    <script>

        // =========================================================
        // Global Variables

        const synth =
            window.speechSynthesis;

        let voices = [];

        let selectedVoiceA = null;
        let selectedVoiceB = null;

        let lines = [];

		let lineSpeakers = [];

		let weakItems = [];

        let currentIndex = 0;

        let isSpeaking = false;
        let isPaused = false;

        let isHighlightEnabled = false;

        /*
            每次重新開始或停止時增加。

            用途：
            防止上一輪朗讀留下來的 setTimeout()
            在新的朗讀流程中又被執行。
        */
        let speechSessionId = 0;

		
		// =========================================================
		// Load Sentence Bank

		function loadSentenceBank() {

    		if (!Array.isArray(sentenceBank)) {
        		return;
    		}

    		document.getElementById("textInput").value =sentenceBank.join("\n");
		}
		
		
		// =========================================================
		// Load Weak Items

		try {

    		const savedWeakItems =
        		localStorage.getItem(
            		"weakItems"
        	);


    	if (savedWeakItems) {

        		weakItems =
            		JSON.parse(
                		savedWeakItems
            );
    		}

		}
		catch (error) {

    		console.error(
        		"Load weak items failed:",
        		error
    		);

    		weakItems = [];
		}


        // =========================================================
        // Voice

        function loadVoices() {

            const allVoices =
                synth.getVoices();

            /*
                只保留美式英文。

                某些瀏覽器可能回傳：
                    en-US

                某些可能大小寫略有不同，
                所以統一轉小寫比較。
            */
            voices =
                allVoices.filter(
                    voice =>
                        voice.lang &&
                        voice.lang.toLowerCase().startsWith("en-")
                );


            if (voices.length === 0) {

                selectedVoiceA = null;
                selectedVoiceB = null;

                updateVoiceDisplay();

                return;
            }


            // -----------------------------------------------------
            // A - Male

            const maleNames = [
                // Microsoft / Windows
				"Guy",
                "Andrew",
                "Brian",
                "Davis",
                "Christopher",
                "Eric",
                "Jason",
                "Roger",
                "Tony",
				
				// Apple / iPhone / Safari
				"Aaron",
				"Fred",
				"Alex"
            ];


            // -----------------------------------------------------
            // B - Female

            const femaleNames = [
                "Jenny",
                "Aria",
                "Ava",
                "Emma",
                "Michelle",
                "Sara",
                "Nancy",
                "Jane",
				
				// Apple / iPhone / Safari
				"Samantha",
				"Nicky",
				"Victoria"
            ];


            selectedVoiceA =
                findBestNaturalVoice(
                    voices,
                    maleNames
                );


            selectedVoiceB =
                findBestNaturalVoice(
                    voices,
                    femaleNames
                );

			if (!selectedVoiceA) {

    selectedVoiceA =
        voices[0];
}


if (!selectedVoiceB) {

    selectedVoiceB =
        voices.find(
            voice =>
                voice !== selectedVoiceA
        ) || voices[0];
}
				
            updateVoiceDisplay();


            console.log(
                "Available en-US voices:",
                voices
            );

            console.log(
                "A Male Voice:",
                selectedVoiceA?.name
            );

            console.log(
                "B Female Voice:",
                selectedVoiceB?.name
            );
        }


        // =========================================================
        // Find Best Voice

        function findBestNaturalVoice(
            voiceList,
            preferredNames) {

            // -----------------------------------------------------
            // Priority 1
            // Online + Natural + Preferred Person

            for (const personName of preferredNames) {

                const voice =
                    voiceList.find(
                        v =>
                            containsIgnoreCase(
                                v.name,
                                personName
                            ) &&
                            containsIgnoreCase(
                                v.name,
                                "Natural"
                            ) &&
                            containsIgnoreCase(
                                v.name,
                                "Online"
                            )
                    );

                if (voice) {
                    return voice;
                }
            }


            // -----------------------------------------------------
            // Priority 2
            // Natural + Preferred Person

            for (const personName of preferredNames) {

                const voice =
                    voiceList.find(
                        v =>
                            containsIgnoreCase(
                                v.name,
                                personName
                            ) &&
                            containsIgnoreCase(
                                v.name,
                                "Natural"
                            )
                    );

                if (voice) {
                    return voice;
                }
            }


            // -----------------------------------------------------
            // Priority 3
            // Preferred Person

            for (const personName of preferredNames) {

                const voice =
                    voiceList.find(
                        v =>
                            containsIgnoreCase(
                                v.name,
                                personName
                            )
                    );

                if (voice) {
                    return voice;
                }
            }

            return null;
        }


        // =========================================================
        // Case-insensitive Contains

        function containsIgnoreCase(
            source,
            target) {

            if (!source || !target) {
                return false;
            }

            return source
                .toLowerCase()
                .includes(
                    target.toLowerCase()
                );
        }


        // =========================================================
        // Voice Display
function updateVoiceDisplay() {

    const voiceASelect =
        document.getElementById(
            "voiceASelect"
        );

    const voiceBSelect =
        document.getElementById(
            "voiceBSelect"
        );


    voiceASelect.innerHTML = "";
    voiceBSelect.innerHTML = "";


    if (voices.length === 0) {

        const optionA =
            document.createElement(
                "option"
            );

        optionA.textContent =
            "找不到美式英文 Voice";

        voiceASelect.appendChild(
            optionA
        );


        const optionB =
            document.createElement(
                "option"
            );

        optionB.textContent =
            "找不到美式英文 Voice";

        voiceBSelect.appendChild(
            optionB
        );

        return;
    }


    voices.forEach(
        function (
            voice,
            index) {

            const optionA =
                document.createElement(
                    "option"
                );

            optionA.value =
                index;

            optionA.textContent =
                voice.name;

            voiceASelect.appendChild(
                optionA
            );


            const optionB =
                document.createElement(
                    "option"
                );

            optionB.value =
                index;

            optionB.textContent =
                voice.name;

            voiceBSelect.appendChild(
                optionB
            );
        }
    );


    const voiceAIndex =
        voices.indexOf(
            selectedVoiceA
        );

    const voiceBIndex =
        voices.indexOf(
            selectedVoiceB
        );


    if (voiceAIndex >= 0) {

        voiceASelect.value =
            voiceAIndex;
    }


    if (voiceBIndex >= 0) {

        voiceBSelect.value =
            voiceBIndex;
    }
}

		function changeVoiceA() {

    const index =
        parseInt(
            document.getElementById(
                "voiceASelect"
            ).value,
            10
        );


    if (Number.isNaN(index) ||
        !voices[index]) {

        return;
    }


    selectedVoiceA =
        voices[index];
}


function changeVoiceB() {

    const index =
        parseInt(
            document.getElementById(
                "voiceBSelect"
            ).value,
            10
        );


    if (Number.isNaN(index) ||
        !voices[index]) {

        return;
    }


    selectedVoiceB =
        voices[index];
}

		// =========================================================
		// Reading Progress

		function updateReadingProgress() {

    		const progress =
        		document.getElementById(
            		"readingProgress"
        		);


    		if (lines.length === 0) {

        		progress.textContent =
            		"第 0 / 0 句（剩餘 0 句）";

        		return;
    		}


    		if (currentIndex >= lines.length) {

        		progress.textContent =
            		"第 " +
            		lines.length +
            		" / " +
            		lines.length +
            		" 句（剩餘 0 句）";

        		return;
    		}


    		const currentNumber =
        		currentIndex + 1;

    		const remaining =
        		lines.length -
        		currentNumber;

    		progress.textContent =
        		"第 " +
        		currentNumber +
        		" / " +
        		lines.length +
        		" 句（剩餘 " +
        		remaining +
        		" 句）";
		}


        // =========================================================
        // Load Voices

        synth.onvoiceschanged =
            loadVoices;

        loadVoices();


        /*
            Chrome / Edge 有時第一次 getVoices()
            會回傳空陣列。

            再稍後讀取一次。
        */
        setTimeout(
            loadVoices,
            500
        );


        updateWeakCount();


        // =========================================================
        // Start Speaking

        function startSpeaking() {

            const mode =
                document.getElementById(
                    "modeSelect"
                ).value;


            const activeItems =
                getActiveItems();


            if (activeItems.length === 0) {

                const weakOnly =
                    document.getElementById(
                        "weakOnlyMode"
                    ).checked;


                alert(
                    weakOnly
                        ? "目前沒有弱項。"
                        : "請輸入文字！"
                );

                return;
            }


            if (!selectedVoiceA ||
                !selectedVoiceB) {

                loadVoices();
            }


            if (!selectedVoiceA) {

                alert(
                    "找不到適合的英文男性 Voice。"
                );

                return;
            }


            if (mode === "dialog" &&
                !selectedVoiceB) {

                alert(

            */
            utterance.lang =

                不人工改變男女聲 Pitch。

                Natural Voice 本身已經包含
                原本男性 / 女性的聲音特徵。
            */
            utterance.pitch =
                1.0;


            /*
                即時取得目前語速。
            */
            utterance.rate =
                parseFloat(
                    document.getElementById(
                        "rateSelect"
                    ).value
                );


            utterance.volume =
                1.0;

            // Start

            utterance.onstart =
                function () {

                    if (sessionId !== speechSessionId) {
                        return;
                    }

                        highlightCurrentText(
                            text,
                            speaker
                        );

                    }
                    else {

                        clearHighlight();
                    }
                };

            // End

            utterance.onend =
                function () {

                    if (sessionId !== speechSessionId) {
                        return;
                    }


                    if (callback) {
                        callback();

            );

        function moveToLine(
            offset) {

            const activeItems =
                getActiveItems();


            if (activeItems.length === 0) {
                return;
            }


            lines =
                activeItems.map(
                    item =>
                        item.text
                );


            lineSpeakers =
                activeItems.map(
                    item =>
                        item.speaker
                );


            let targetIndex;


            /*
                如果已經整段播放完，
                currentIndex 會等於 lines.length。

                此時按上一句，
                回到最後一句。
            */
            if (currentIndex >= lines.length) {

                if (offset < 0) {

                    targetIndex =
                        lines.length - 1;

                }
                else {

                    return;
                }

            }
            else {

                targetIndex =
                    currentIndex +
                    offset;
            }


            /*
                已經在第一句 / 最後一句，
                就不要超出去。
            */
            if (targetIndex < 0 ||
                targetIndex >= lines.length) {

                return;
            }


            synth.cancel();

            speechSessionId++;


            currentIndex =
                targetIndex;

            isPaused =
                false;

            isSpeaking =
                true;


            const currentSessionId =
                speechSessionId;


            speakNext(
                currentSessionId
            );
        }

                    .filter(
                        line =>
                            line.length > 0
                    );

                Fisher-Yates Shuffle

            for (

                [
                    tempLines[i],
                    tempLines[j]

                [
                    tempLines[j],
                    tempLines[i]

                "textInput"

        let kokoroTts = null;
        let kokoroDevice = null;
        let kokoroInitFailed = false;
        let kokoroLoading = false;

        let selectedKokoroVoiceA =
            "am_michael";

        let selectedKokoroVoiceB =
            "af_heart";

        /*
            Session cache:
            The first generation of a sentence is kept as a WAV Blob.
            Repeating the same sentence does not run the model again.
        */
        const kokoroAudioCache =
            new Map();

        const kokoroPendingAudio =
            new Map();

        let kokoroAudioContext = null;
        let currentKokoroSource = null;
        let kokoroPlayToken = 0;


        // =========================================================
        // Keep Original Functions

        const browserUpdateVoiceDisplay =
            updateVoiceDisplay;

        const browserChangeVoiceA =
            changeVoiceA;

        const browserChangeVoiceB =
            changeVoiceB;

        const originalStartSpeaking =
            startSpeaking;

        const originalSpeakNext =
            speakNext;

        const browserSpeakText =
            speakText;

        const browserTogglePause =
            togglePause;

        const originalStopSpeaking =
            stopSpeaking;

        const originalMoveToLine =
            moveToLine;


        // =========================================================
        // Platform / Engine Selection

        function isIOSDevice() {

            const userAgent =
                navigator.userAgent || "";

            const normalIOS =
                /iPhone|iPad|iPod/i.test(
                    userAgent
                );

            /*
                iPadOS can report itself as MacIntel.
            */
            const desktopModeIPad =
                navigator.platform === "MacIntel" &&
                navigator.maxTouchPoints > 1;

            return (
                normalIOS ||
                desktopModeIPad
            );
        }


        function getRequestedTtsEngine() {

            return document
                .getElementById(
                    "ttsEngineSelect"
                )
                .value;
        }


        function getEffectiveTtsEngine() {

            const requested =
                getRequestedTtsEngine();


            if (requested === "browser") {
                return "browser";
            }


            if (requested === "kokoro") {

                return kokoroInitFailed
                    ? "browser"
                    : "kokoro";
            }


            /*
                Auto:
                iPhone / iPad -> Kokoro
                Desktop      -> Browser TTS

                Kokoro initialization failure -> Browser TTS fallback.
            */
            if (isIOSDevice() &&
                !kokoroInitFailed) {

                return "kokoro";
            }


            return "browser";
        }


        function updateTtsStatus(
            text) {

            const status =
                document.getElementById(
                    "ttsStatus"
                );


            if (!status) {
                return;
            }


            if (text) {

                status.textContent =
                    text;

                return;
            }


            if (getEffectiveTtsEngine() ===
                "kokoro") {

                if (kokoroTts) {

                    status.textContent =
                        "目前：Kokoro / " +
                        (
                            kokoroDevice === "webgpu"
                                ? "WebGPU / fp32"
                                : "WASM / q8"
                        );

                }
                else {

                    status.textContent =
                        "Kokoro 尚未載入（按「載入 Kokoro」或「開始朗讀」）";
                }

            }
            else {

                status.textContent =
                    "目前：瀏覽器 TTS";
            }
        }


        // =========================================================
        // Kokoro Initialization

        async function unlockKokoroAudio() {

            if (!kokoroAudioContext) {

                const AudioContextClass =
                    window.AudioContext ||
                    window.webkitAudioContext;


                if (!AudioContextClass) {

                    throw new Error(
                        "Web Audio API is not supported."
                    );
                }


                kokoroAudioContext =
                    new AudioContextClass();
            }


            if (kokoroAudioContext.state ===
                "suspended") {

                await kokoroAudioContext
                    .resume();
            }
        }


        async function loadKokoroModule() {

            if (!kokoroModulePromise) {

                kokoroModulePromise =
                    import(
                        KOKORO_MODULE_URL
                    );
            }


            return kokoroModulePromise;
        }


        function updateKokoroProgress(
            progress) {

            if (!progress) {
                return;
            }


            const percent =
                Number(
                    progress.progress
                );


            const fileName =
                progress.file ||
                progress.name ||
                "模型";


            if (Number.isFinite(percent)) {

                updateTtsStatus(
                    "Kokoro：下載 " +
                    fileName +
                    " " +
                    Math.round(percent) +
                    "%"
                );

                return;
            }


            if (progress.status) {

                updateTtsStatus(
                    "Kokoro：" +
                    progress.status
                );
            }
        }


        async function manualLoadKokoro() {

            const button =
                document.getElementById(
                    "loadKokoroBtn"
                );


            if (kokoroTts) {

                updateTtsStatus();

                return;
            }


            if (kokoroLoading) {
                return;
            }


            button.disabled =
                true;

            button.textContent =
                "載入中...";


            try {

                kokoroInitFailed =
                    false;


                await ensureKokoroReady();

            }
            finally {

                button.disabled =
                    false;

                button.textContent =
                    kokoroTts
                        ? "Kokoro 已載入"
                        : "載入 Kokoro";
            }
        }


        async function ensureKokoroReady() {

            if (kokoroTts) {
                return true;
            }


            if (kokoroInitPromise) {
                return kokoroInitPromise;
            }


            kokoroInitFailed = false;


            kokoroInitPromise =
                (async function () {

                    try {

                        updateTtsStatus(
                            "Kokoro：載入程式庫..."
                        );


                        const module =
                            await loadKokoroModule();

                        const KokoroTTS =
                            module.KokoroTTS;


                        if (!KokoroTTS) {

                            throw new Error(
                                "KokoroTTS module not found."
                            );
                        }


                        kokoroLoading =
                            true;


                        /*
                            iPhone / iPad:
                            直接使用 q8 + WASM。

                            原因：WebGPU + fp32 模型約 325 MB，
                            對行動網路與 Safari 記憶體都太重。
                            q8 模型約 90 MB，較適合手機實測。
                        */
                        if (isIOSDevice()) {

                            updateTtsStatus(
                                "Kokoro：載入手機版模型（q8 / WASM）..."
                            );


                            kokoroTts =
                                await KokoroTTS
                                    .from_pretrained(
                                        KOKORO_MODEL_ID,
                                        {
                                            dtype:
                                                "fp32",

                                            device:
                                                "webgpu",

                                            progress_callback:
                                                updateKokoroProgress
                                        }
                                    );


                            kokoroDevice =
                                "wasm";
                        }
                        else {

                            /*
                                Desktop:
                                WebGPU 優先，失敗再退回 WASM + q8。
                            */
                            if (navigator.gpu) {

                                try {

                                    updateTtsStatus(
                                        "Kokoro：載入模型（WebGPU）..."
                                    );


                                    kokoroTts =
                                        await KokoroTTS
                                            .from_pretrained(
                                                KOKORO_MODEL_ID,
                                                {
                                                    dtype:
                                                        "fp32",

                                                    device:
                                                        "webgpu",

                                                    progress_callback:
                                                        updateKokoroProgress
                                                }
                                            );


                                    kokoroDevice =
                                        "webgpu";

                                }
                                catch (webGpuError) {

                                    console.warn(
                                        "Kokoro WebGPU failed; falling back to WASM.",
                                        webGpuError
                                    );


                                    kokoroTts =
                                        null;
                                }
                            }


                            if (!kokoroTts) {

                                updateTtsStatus(
                                    "Kokoro：載入模型（WASM）..."
                                );


                                kokoroTts =
                                    await KokoroTTS
                                        .from_pretrained(
                                            KOKORO_MODEL_ID,
                                            {
                                                dtype:
                                                    "q8",

                                                device:
                                                    "wasm",

                                                progress_callback:
                                                    updateKokoroProgress
                                            }
                                        );


                                kokoroDevice =
                                    "wasm";
                            }
                        }


                        kokoroLoading =
                            false;


                        populateKokoroVoiceDisplay();

                        updateTtsStatus();


                        const loadButton =
                            document.getElementById(
                                "loadKokoroBtn"
                            );

                        if (loadButton) {

                            loadButton.textContent =
                                "Kokoro 已載入";
                        }


                        return true;

                    }
                    catch (error) {

                        console.error(
                            "Kokoro initialization failed:",
                            error
                        );


                        kokoroTts = null;
                        kokoroDevice = null;
                        kokoroInitFailed = true;
                        kokoroLoading = false;


                        updateTtsStatus(
                            "Kokoro 載入失敗，已改用瀏覽器 TTS"
                        );


                        loadVoices();
                        updateVoiceDisplay();

                        return false;

                    }
                    finally {

                        kokoroInitPromise =
                            null;
                    }
                })();


            return kokoroInitPromise;
        }


        // =========================================================
        // Voice UI

        function showKokoroVoicePlaceholder() {

            const voiceASelect =
                document.getElementById(
                    "voiceASelect"
                );

            const voiceBSelect =
                document.getElementById(
                    "voiceBSelect"
                );


            voiceASelect.innerHTML = "";
            voiceBSelect.innerHTML = "";


            const optionA =
                document.createElement(
                    "option"
                );

            optionA.value =
                selectedKokoroVoiceA;

            optionA.textContent =
                "請先載入 Kokoro";


            const optionB =
                document.createElement(
                    "option"
                );

            optionB.value =
                selectedKokoroVoiceB;

            optionB.textContent =
                "請先載入 Kokoro";


            voiceASelect.appendChild(
                optionA
            );

            voiceBSelect.appendChild(
                optionB
            );
        }


        function populateKokoroVoiceDisplay() {

            if (!kokoroTts) {

                showKokoroVoicePlaceholder();

                return;
            }


            const voiceASelect =
                document.getElementById(
                    "voiceASelect"
                );

            const voiceBSelect =
                document.getElementById(
                    "voiceBSelect"
                );


            voiceASelect.innerHTML = "";
            voiceBSelect.innerHTML = "";


            const allVoices =
                Object.entries(
                    kokoroTts.voices ||
                    {}
                );


            const maleVoices =
                allVoices.filter(
                    ([id]) =>
                        id.startsWith(
                            "am_"
                        )
                );

            const femaleVoices =
                allVoices.filter(
                    ([id]) =>
                        id.startsWith(
                            "af_"
                        )
                );


            function addOptions(
                select,
                entries) {

                entries.forEach(
                    function (
                        [id, info]) {

                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            id;

                        option.textContent =
                            (info?.name || id) +
                            " (" +
                            id +
                            ")";


                        select.appendChild(
                            option
                        );
                    }
                );
            }


            addOptions(
                voiceASelect,
                maleVoices
            );

            addOptions(
                voiceBSelect,
                femaleVoices
            );


            if (maleVoices.some(
                    ([id]) =>
                        id ===
                        selectedKokoroVoiceA
                )) {

                voiceASelect.value =
                    selectedKokoroVoiceA;

            }
            else if (maleVoices.length > 0) {

                selectedKokoroVoiceA =
                    maleVoices[0][0];

                voiceASelect.value =
                    selectedKokoroVoiceA;
            }


            if (femaleVoices.some(
                    ([id]) =>
                        id ===
                        selectedKokoroVoiceB
                )) {

                voiceBSelect.value =
                    selectedKokoroVoiceB;

            }
            else if (femaleVoices.length > 0) {

                selectedKokoroVoiceB =
                    femaleVoices[0][0];

                voiceBSelect.value =
                    selectedKokoroVoiceB;
            }
        }


        updateVoiceDisplay =
            function () {

                if (getEffectiveTtsEngine() ===
                    "kokoro") {

                    if (kokoroTts) {

                        populateKokoroVoiceDisplay();

                    }
                    else {

                        showKokoroVoicePlaceholder();
                    }

                    return;
                }


                browserUpdateVoiceDisplay();
            };


        changeVoiceA =
            function () {

                if (getEffectiveTtsEngine() ===
                    "kokoro") {

                    selectedKokoroVoiceA =
                        document
                            .getElementById(
                                "voiceASelect"
                            )
                            .value;

                    return;
                }


                browserChangeVoiceA();
            };


        changeVoiceB =
            function () {

                if (getEffectiveTtsEngine() ===
                    "kokoro") {

                    selectedKokoroVoiceB =
                        document
                            .getElementById(
                                "voiceBSelect"
                            )
                            .value;

                    return;
                }


                browserChangeVoiceB();
            };


        // =========================================================
        // Kokoro Audio Generation / Playback

        function getKokoroCacheKey(
            text,
            voice,
            rate) {

            return (
                voice +
                "|" +
                rate.toFixed(1) +
                "|" +
                text
            );
        }


        async function getKokoroAudioBlob(
            text,
            voice,
            rate) {

            const key =
                getKokoroCacheKey(
                    text,
                    voice,
                    rate
                );


            if (kokoroAudioCache.has(
                    key
                )) {

                return kokoroAudioCache.get(
                    key
                );
            }


            if (kokoroPendingAudio.has(
                    key
                )) {

                return kokoroPendingAudio.get(
                    key
                );
            }


            const promise =
                (async function () {

                    const rawAudio =
                        await kokoroTts.generate(
                            text,
                            {
                                voice:
                                    voice,

                                speed:
                                    rate
                            }
                        );


                    const blob =
                        rawAudio.toBlob();


                    kokoroAudioCache.set(
                        key,
                        blob
                    );


                    return blob;
                })();


            kokoroPendingAudio.set(
                key,
                promise
            );


            try {

                return await promise;

            }
            finally {

                kokoroPendingAudio.delete(
                    key
                );
            }
        }


        function stopKokoroPlayback() {

            kokoroPlayToken++;


            if (!currentKokoroSource) {
                return;
            }


            try {

                currentKokoroSource.onended =
                    null;

                currentKokoroSource.stop();

            }
            catch (error) {
                // Source may already have ended.
            }


            currentKokoroSource =
                null;
        }


        async function speakTextWithKokoro(
            text,
            sessionId,
            speaker,
            callback) {

            if (sessionId !== speechSessionId ||
                !isSpeaking ||
                isPaused) {

                return;
            }


            const playToken =
                ++kokoroPlayToken;


            const voice =
                speaker === "B"
                    ? selectedKokoroVoiceB
                    : selectedKokoroVoiceA;


            const rate =
                parseFloat(
                    document.getElementById(
                        "rateSelect"
                    ).value
                );


            try {

                updateTtsStatus(
                    "Kokoro：產生語音..."
                );


                const blob =
                    await getKokoroAudioBlob(
                        text,
                        voice,
                        rate
                    );


                if (playToken !== kokoroPlayToken ||
                    sessionId !== speechSessionId ||
                    !isSpeaking ||
                    isPaused) {

                    updateTtsStatus();

                    return;
                }


                await unlockKokoroAudio();


                const arrayBuffer =
                    await blob.arrayBuffer();

                const audioBuffer =
                    await kokoroAudioContext
                        .decodeAudioData(
                            arrayBuffer.slice(0)
                        );


                if (playToken !== kokoroPlayToken ||
                    sessionId !== speechSessionId ||
                    !isSpeaking ||
                    isPaused) {

                    updateTtsStatus();

                    return;
                }


                stopKokoroPlayback();

                /*
                    stopKokoroPlayback() increments the token,
                    so this playback receives a fresh token.
                */
                const activeToken =
                    ++kokoroPlayToken;


                const source =
                    kokoroAudioContext
                        .createBufferSource();


                source.buffer =
                    audioBuffer;

                source.connect(
                    kokoroAudioContext.destination
                );


                currentKokoroSource =
                    source;


                updateReadingProgress();


                if (isHighlightEnabled) {

                    highlightCurrentText(
                        text,
                        speaker
                    );

                }
                else {

                    clearHighlight();
                }


                updateTtsStatus();


                source.onended =
                    function () {

                        if (activeToken !==
                            kokoroPlayToken) {

                            return;
                        }


                        currentKokoroSource =
                            null;


                        if (sessionId !==
                            speechSessionId ||
                            !isSpeaking ||
                            isPaused) {

                            return;
                        }


                        if (callback) {
                            callback();
                        }
                    };


                source.start(0);

            }
            catch (error) {

                console.error(
                    "Kokoro speech failed:",
                    error
                );


                kokoroInitFailed =
                    true;


                updateTtsStatus(
                    "Kokoro 失敗，已改用瀏覽器 TTS"
                );


                loadVoices();
                updateVoiceDisplay();


                const browserVoice =
                    speaker === "B"
                        ? selectedVoiceB
                        : selectedVoiceA;


                if (browserVoice) {

                    browserSpeakText(
                        text,
                        browserVoice,
                        sessionId,
                        speaker,
                        callback
                    );
                }
            }
        }


        // =========================================================
        // Override Common Speech Function

        speakText =
            function (
                text,
                voice,
                sessionId,
                speaker,
                callback) {

                if (getEffectiveTtsEngine() ===
                    "kokoro" &&
                    kokoroTts) {

                    speakTextWithKokoro(
                        text,
                        sessionId,
                        speaker,
                        callback
                    );

                    return;
                }


                browserSpeakText(
                    text,
                    voice,
                    sessionId,
                    speaker,
                    callback
                );
            };


        // =========================================================
        // Start Speaking

        startSpeaking =
            async function () {

                if (getEffectiveTtsEngine() ===
                    "kokoro") {

                    try {

                        /*
                            Run this directly from the Start button click
                            so iPhone Safari authorizes audio output.
                        */
                        await unlockKokoroAudio();

                    }
                    catch (error) {

                        console.warn(
                            "Unable to unlock Web Audio:",
                            error
                        );
                    }


                    const ready =
                        await ensureKokoroReady();


                    if (!ready) {

                        /*
                            ensureKokoroReady() already switched
                            effective engine to Browser TTS.
                        */
                        updateVoiceDisplay();
                    }
                }


                originalStartSpeaking();
            };


        // =========================================================
        // Dialog Playback

        speakNext =
            function (
                sessionId) {

                /*
                    The original dialog mode uses the browser's
                    speechSynthesis queue when delay = 0.

                    Kokoro cannot use that queue, so run it line-by-line.
                */
                if (getEffectiveTtsEngine() ===
                    "kokoro" &&
                    kokoroTts &&
                    document.getElementById(
                        "modeSelect"
                    ).value === "dialog") {

                    if (sessionId !== speechSessionId ||
                        !isSpeaking ||
                        isPaused) {

                        return;
                    }


                    if (currentIndex >= lines.length) {

                        isSpeaking = false;

                        clearHighlight();
                        updateReadingProgress();

                        return;
                    }


                    speakDialogLine(
                        sessionId
                    );

                    return;
                }


                originalSpeakNext(
                    sessionId
                );
            };


        // =========================================================
        // Pause / Resume

        togglePause =
            async function () {

                if (getEffectiveTtsEngine() !==
                    "kokoro" ||
                    !kokoroTts) {

                    browserTogglePause();

                    return;
                }


                if (!isSpeaking) {
                    return;
                }


                if (isPaused) {

                    isPaused =
                        false;


                    if (currentKokoroSource &&
                        kokoroAudioContext &&
                        kokoroAudioContext.state ===
                            "suspended") {

                        await kokoroAudioContext
                            .resume();

                    }
                    else {

                        /*
                            If pause happened while the model was generating,
                            restart the current line. The pending/cache map
                            prevents unnecessary duplicate inference.
                        */
                        speakNext(
                            speechSessionId
                        );
                    }

                }
                else {

                    isPaused =
                        true;


                    if (currentKokoroSource &&
                        kokoroAudioContext) {

                        await kokoroAudioContext
                            .suspend();

                    }
                    else {

                        /*
                            Cancel only the pending playback request.
                            Model inference may finish and enter cache.
                        */
                        kokoroPlayToken++;
                    }
                }
            };


        // =========================================================
        // Stop / Previous / Next

        stopSpeaking =
            function () {

                stopKokoroPlayback();


                if (kokoroAudioContext &&
                    kokoroAudioContext.state ===
                        "suspended") {

                    kokoroAudioContext
                        .resume()
                        .catch(
                            () => {}
                        );
                }


                originalStopSpeaking();

                updateTtsStatus();
            };


        moveToLine =
            function (
                offset) {

                stopKokoroPlayback();

                originalMoveToLine(
                    offset
                );

                /*
                    Update immediately when Previous / Next is pressed.
                */
                updateReadingProgress();
            };


        // =========================================================
        // Engine Selector

        document
            .getElementById(
                "ttsEngineSelect"
            )
            .addEventListener(
                "change",
                function () {

                    stopSpeaking();

                    kokoroInitFailed =
                        false;


                    if (getEffectiveTtsEngine() ===
                        "kokoro") {

                        /*
                            Do not download the large model immediately.
                            It is initialized on the first Start click.
                        */
                        if (kokoroTts) {

                            populateKokoroVoiceDisplay();

                        }
                        else {

                            showKokoroVoicePlaceholder();
                        }

                    }
                    else {

                        loadVoices();
                        browserUpdateVoiceDisplay();
                    }


                    updateTtsStatus();
                }
            );


        // =========================================================
        // Initial Engine UI

        updateTtsStatus();


        if (getEffectiveTtsEngine() ===
            "kokoro") {

            showKokoroVoicePlaceholder();

        }
        else {

            loadVoices();
        }

    </script>


</body>
</html>
